[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensixpe"
version = "0.0.1"
description = "TensixPE: a CGRA-style PE graph abstraction over Tanto/TT-Metal"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tensixpe*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
